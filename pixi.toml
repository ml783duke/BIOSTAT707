[workspace]
name = "biostat707-checkpoint1"
channels = [ "conda-forge" ]
platforms = [ "linux-64" , "osx-arm64" , "osx-64" , "win-64" ]

[dependencies]
python = "3.12.*"
jupyterlab = ">=4"
nbconvert = "*"
ipykernel = "*"
nbstripout = "*"
pandas = "*"
numpy = "*"
matplotlib = "*"
seaborn = "*"
missingno = "*"
tableone = "*"
statsmodels = "*"
scipy = "*"
r-base = "4.5.*"
"r-data.table" = "*"

[tasks]
checkpoint1 = "jupyter nbconvert --to html --execute checkpoint1.ipynb --output-dir output --ExecutePreprocessor.timeout=1800"
lab = "jupyter lab"
