[workspace]
name = "biostat707-checkpoint1"
channels = [ "conda-forge" ]
platforms = [ "linux-64" , "osx-arm64" , "osx-64" , "win-64" ]

[dependencies]
quarto = ">=1.7"
r-base = "4.5.*"
r-knitr = "*"
r-rmarkdown = "*"
"r-data.table" = "*"
r-dplyr = "*"
r-tidyr = "*"
r-ggplot2 = "*"
r-gtsummary = "*"
r-naniar = "*"
r-visdat = "*"
r-upsetr = "*"
r-sessioninfo = "*"
r-here = "*"
r-readr = "*"
python = "3.12.*"
pandas = "*"

[tasks]
checkpoint1 = "quarto render checkpoint1.qmd --output-dir output"
